name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app-android/**'
      - 'src/slac/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper
        # Garante que o gradlew tenha permissão de execução no Ubuntu
        run: chmod +x app-android/gradlew || echo "gradlew not found, will be generated"

      - name: Build Debug APK
        # O PONTO É CRUCIAL: ./gradlew usa a versão 8.4, não a 9.7.1 do servidor
        run: ./gradlew assembleDebug --no-daemon
        working-directory: app-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slacodec-app-debug
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
