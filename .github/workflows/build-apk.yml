name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app-android/**'
      - 'src/slac/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper (v8.4)
        # Este comando cria o script 'gradlew' e baixa o jar da versão 8.4
        run: gradle wrapper --gradle-version 8.4
        working-directory: app-android

      - name: Build Debug APK
        # Agora o ./gradlew existe e usará exatamente a versão 8.4
        run: ./gradlew assembleDebug --no-daemon
        working-directory: app-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slacodec-app-debug
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
